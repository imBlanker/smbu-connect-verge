name: build

on:
  push:
    branches: ["main", "develop"]
    tags:
      - "v*"

  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    if: always()
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv and restore cache
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.20"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Dependencies
        run: uv sync

      - name: Download ZJU-connect Core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/core
          Invoke-WebRequest -Uri "https://github.com/Mythologyli/zju-connect/releases/download/v0.9.0/zju-connect-${{ matrix.os_name }}-${{ matrix.arch }}.zip" -OutFile app/core/zju-connect.zip
          Expand-Archive -Path app/core/zju-connect.zip -DestinationPath app/core -Force
          Remove-Item app/core/zju-connect.zip

      - name: Build Executable
        run: |
          .\.venv\Scripts\Activate.ps1
          pyside6-rcc .\app\resources\resources.qrc -o .\app\common\resources.py

          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --include-data-dir=app=app `
            --include-data-files=app\core\zju-connect.exe=app\core\zju-connect.exe `
            --include-data-files=.app-version=.app-version `
            --product-name="SMBU Connect Verge" `
            --product-version=$(Get-Content .app-version) `
            --file-description="SMBU Connect Verge" `
            --windows-icon-from-ico=app\resources\icons\icon.ico `
            --windows-console-mode=disable `
            --output-dir=dist `
            --remove-output `
            app/main.py

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\main.dist\* -DestinationPath dist\smbu-connect-verge-windows-${{ matrix.arch }}-portable.zip

      - name: Compile Installer
        run: |
          choco install innosetup -y
          $version = Get-Content .app-version
          $setup_script = ".\setup.iss"
          iscc /DMyAppVersion="$version" `
               /DArchitecture="${{ matrix.arch }}" `
               $setup_script

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: smbu-connect-verge-${{ matrix.os_name }}-${{ matrix.arch }}-setup
          path: dist/smbu-connect-verge-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: smbu-connect-verge-${{ matrix.os_name }}-${{ matrix.arch }}-portable
          path: dist/smbu-connect-verge-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

  release:
    permissions: write-all
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
          prerelease: false
          allowUpdates: true
